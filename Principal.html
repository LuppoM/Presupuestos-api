<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESTIÓN DE TORNERÍA</title>

    <!-- Ícono ubicado en la carpeta static / archivos -->
    <link rel="icon" type="image/x-icon" href="/archivos/icono.ico">

    <!-- CSS de la vista principal -->
    <link rel="stylesheet" href="/archivos/principalvista.css">
</head>
<body>

    <div class="fondo-frame">
        <div class="button-frame">

            <!-- 1. BOTÓN FIJO: PRESUPUESTOS -->
            <a href="/presupuestos" class="custom-button">PRESUPUESTOS</a>

            <!-- 2. BOTÓN FIJO: MATERIAS PRIMAS -->
            <a href="/materias_primas" class="custom-button">MATERIAS PRIMAS</a>

            <!-- 3. BOTÓN SALIR -->
            <a href="javascript:void(0)" onclick="cerrarSesion()" class="custom-button salir">SALIR</a>

        </div>
    </div>

    <script>
        // Función para abrir / cerrar desplegables
        function toggleDropdown(event, menuId) {
            event.stopPropagation();
            
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                if (menu.id !== menuId) {
                    menu.classList.remove('show');
                }
            });

            const menu = document.getElementById(menuId);
            if (menu) {
                menu.classList.toggle('show');
            }
        }

        // Cerrar menú al hacer click fuera
        window.addEventListener('click', function() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                menu.classList.remove('show');
            });
        });

        // Función para confirmar la salida
        function cerrarSesion() {
            if (confirm("¿Desea salir del sistema?")) {
                window.location.href = "/";
            }
        }
    </script>
</body>
</html>c
